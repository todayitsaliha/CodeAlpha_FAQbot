name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8 .
      - name: Format check (Black)
        run: black --check .
      - name: Download NLTK data
        run: python -m scripts.setup_nltk
      - name: Unit tests (pytest)
        run: pytest
      - name: Validate FAQ data
        run: python -m scripts.validate_data
      # Regression floors only. The 80% target is tracked in docs/matching-engine.md.
      - name: Accuracy regression floor (main set)
        run: python -m scripts.evaluate --min-top1 0.78
      - name: Accuracy regression floor (held-out set 1)
        run: python -m scripts.evaluate --dataset final --min-top1 0.50
      - name: Accuracy regression floor (held-out set 2)
        run: python -m scripts.evaluate --dataset final2 --min-top1 0.55
